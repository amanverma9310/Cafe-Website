# Render Blueprint for the API. Frontend goes on Vercel (see README).
services:
  - type: web
    name: agama-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: MONGO_URI, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: CLIENT_URL, sync: false }
      - { key: CLOUDINARY_CLOUD_NAME, sync: false }
      - { key: CLOUDINARY_API_KEY, sync: false }
      - { key: CLOUDINARY_API_SECRET, sync: false }
